map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Notification service: REST + WebSocket (Socket.IO)
    location /api/notifications {
        proxy_pass http://notification:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /socket.io/ {
        proxy_pass http://notification:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # API Go
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # phân tích có thể chờ ML service
        client_max_body_size 12m;  # import Excel tối đa 10MB
    }

    # File build có hash trong tên → cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi route (/login, /projects/:id, /invitations/:token...) trả về index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
